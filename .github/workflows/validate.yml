name: Validate package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Build the production process identity helper for native interop checks
        run: dotnet build tests/identity-probe/IdentityProbe.csproj --configuration Release
      - name: Run supervisor and distribution tests
        env:
          LAUNCHER_IDENTITY_PROBE: tests/identity-probe/bin/Release/net8.0/IdentityProbe.dll
        run: python -m unittest discover -s tests -v
      - name: Build and validate release archives
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          $metadata = Get-Content -Raw Packages/com.vrclearn.mcp-for-unity-launcher/package.json | ConvertFrom-Json
          $url = "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$($metadata.version)/$($metadata.name)-$($metadata.version).zip"
          python tools/build_package.py --output dist --download-url $url --repository $env:RELEASE_REPOSITORY --revision $env:RELEASE_REVISION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
